<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 - To-Do List App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .todo-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 30px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #f0f6fc; margin-bottom: 20px; text-align: center; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: #fff; outline: none; }
        input[type="text"]:focus { border-color: #58a6ff; }
        button.add-btn { background-color: #238636; color: white; border: none; padding: 12px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.add-btn:hover { background-color: #2ea043; }
        ul { list-style: none; }
        li { background-color: #21262d; border: 1px solid #30363d; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        li.completed { text-decoration: line-through; opacity: 0.6; border-left: 4px solid #238636; }
        li.pending { border-left: 4px solid #d29922; }
        .actions { display: flex; gap: 8px; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="todo-card">
        <h2>⚡ Day 1: To-Do Tracker</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new project task...">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();
            if (taskText === '') return;

            const ul = document.getElementById('taskList');
            const li = document.createElement('li');
            li.className = 'pending';
            li.innerHTML = `
                <span>${taskText}</span>
                <div class="actions">
                    <button class="action-btn" onclick="toggleTask(this)">✅</button>
                    <button class="action-btn" onclick="deleteTask(this)">🗑️</button>
                </div>
            `;
            ul.appendChild(li);
            input.value = '';
        }

        function toggleTask(btn) {
            const li = btn.parentElement.parentElement;
            li.classList.toggle('completed');
            li.classList.toggle('pending');
        }

        function deleteTask(btn) {
            const li = btn.parentElement.parentElement;
            li.remove();
        }
    </script>
</body>
</html>
